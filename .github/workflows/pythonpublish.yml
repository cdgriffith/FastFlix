# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy-generic:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      run: python -m pip install uv --upgrade

    # `uv run pip install ...` put build/twine in the system Python instead of the project .venv, so
    # `uv run python -m build` failed with "No module named build". uv builds the wheel itself (isolated build
    # env from pyproject's build-system) and uvx runs twine in its own environment.
    - name: Build and Publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}

      run: |
        uv build --wheel
        uvx twine check dist/*.whl
        uvx twine upload dist/*.whl
